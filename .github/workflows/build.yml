name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Номер прогона — он же versionCode приложения и тег релиза (v<run_number>).
      # Автообновление в приложении сравнивает BuildConfig.VERSION_CODE с этим тегом.
      - name: Build debug APK
        run: ./gradlew assembleDebug -PappVersionCode=${{ github.run_number }} --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/cs2a-helper-v${{ github.run_number }}.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: cs2a-helper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release (для автообновления в приложении)
        run: |
          gh release create "v${{ github.run_number }}" \
            "app/build/outputs/apk/debug/cs2a-helper-v${{ github.run_number }}.apk" \
            --title "CS2A Помощник 1.0.${{ github.run_number }} (build ${{ github.run_number }})" \
            --latest \
            --notes "Автосборка из коммита ${{ github.sha }}."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Announce successful release in Telegram channel
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@runchikist"
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/v${{ github.run_number }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::notice::Telegram announcement skipped: TELEGRAM_BOT_TOKEN secret is not configured."
            exit 0
          fi

          PR_JSON="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0] // {} | {title: (.title // ""), body: (.body // "")}')"
          export PR_JSON
          python3 - <<'PY' > telegram-message.html
          import html, json, os, re
          pr = json.loads(os.environ.get("PR_JSON", "{}") or "{}")
          number = os.environ["BUILD_NUMBER"]
          title = pr.get("title", "")
          body = pr.get("body", "")

          # Русские названия для уже известных технических PR.
          known = {
              "Publish successful app updates to Telegram channel": (
                  "Автоматические уведомления об обновлениях",
                  ["Настроена автоматическая публикация новостей о новых версиях приложения."]
              ),
              "Redesign navigation and screens with a modern Material 3 layout": (
                  "Обновлён дизайн приложения",
                  ["Обновлена нижняя панель навигации и оформление разделов."]
              ),
              "Polish Telegram promo settings and remove cashback UI": (
                  "Улучшены настройки Telegram и фермы",
                  ["Настройки авторизации Telegram собраны в одном разделе.",
                   "Убраны устаревшие элементы кешбэка."]
              ),
          }

          known["Убрать упоминания источника промокодов и добавить раздел разработчика"] = (
              "Обновление приложения",
              ["Исправлено окно с логами.", "Добавлен раздел «О разработчике»."]
          )

          if title in known:
              title_ru, bullets = known[title]
          else:
              title_ru = title if re.search(r"[А-Яа-яЁё]", title) else "Улучшения и исправления"
              bullets = []
              section = False
              for line in body.splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  if line.startswith("#"):
                      heading = line.lstrip("# ").lower()
                      section = heading in ("изменения", "что нового", "исправления", "улучшения")
                      continue
                  if line.lower().startswith(("the channel", "no parser", "the bot", "keep the bot")):
                      continue
                  if line.startswith(("-", "*")) and section:
                      item = line.lstrip("-* ").strip()
                      if re.search(r"[А-Яа-яЁё]", item):
                          bullets.append(item)
          bullets = bullets[:8]
          message = (
              "🚀 <b>Вышло новое обновление CS2A Helper!</b>\n\n"
              f"<b>Сборка:</b> {html.escape(number)}\n"
              f"<b>{html.escape(title_ru)}</b>\n\n"
              + "\n".join("• " + html.escape(item) for item in bullets)
          )
          print(message)
          PY

          RESPONSE="$(curl --fail-with-body --silent --show-error \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            --data-binary @- <<JSON
          {
            "chat_id": "$TELEGRAM_CHAT_ID",
            "text": $(python3 -c 'import json; print(json.dumps(open("telegram-message.html", encoding="utf-8").read()))'),
            "parse_mode": "HTML",
            "disable_web_page_preview": true
          }
          JSON
          )"
          echo "$RESPONSE" | python3 -c 'import json,sys; r=json.load(sys.stdin); print("Telegram message_id:", r.get("result", {}).get("message_id", "unknown")) if r.get("ok") else sys.exit("Telegram API error: " + str(r.get("description", "unknown error")))'
